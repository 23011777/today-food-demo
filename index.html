<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一格 · 给自己一点能量</title><link rel="stylesheet" href="style.css"><body><main><header><b>▧ 一格</b><span>DAILY LITTLE CARE</span></header><section class="intro"><small id="date"></small><h1>今天的你，<br>电量还好吗？<i>✳</i></h1><p>不必一直满格。停一下，照顾自己。</p></section><section class="card"><div class="eyebrow">01 / 感受此刻</div><h2>选一格，安放今天的心情</h2><div id="moods" class="moods"></div><div class="energy"><span id="energyLabel">平平稳稳，也很好。</span><b id="percent">60%</b></div><div class="track"><div id="fill"></div></div><label for="note">留一句给自己 <span>选填 · 60字以内</span></label><textarea id="note" maxlength="60" placeholder="今天有什么小小的瞬间？"></textarea></section><section class="action"><div><div class="eyebrow">02 / 补充一点能量</div><h2 id="task">去窗边，看看远处的天空</h2><p>给自己 1 分钟就够了</p></div><button id="swap" aria-label="换一个小行动">↻</button></section><button class="primary" id="save">收好今天这一格 <span>↗</span></button><p id="status" role="status" class="status">你的记录只保存在这台设备上</p><section class="history"><div class="heading"><h2>我的能量足迹</h2><span id="count">0 天</span></div><div id="records"></div></section><footer>一小格，也是在好好生活。<br><small>YIGE · MAKE ROOM FOR YOURSELF</small></footer></main><script src="app.js"></script></body></html>
